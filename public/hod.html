<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/hod.css">
    <script src="hod.js" defer></script>
</head>


<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo" width="36" height="36" style="border-radius:50%">
            </a>
        </div>
    </nav>
    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-lg-11 col-xl-10">
                <div class="card shadow-lg border-0 rounded-4 p-4 mt-5 animate__animated animate__fadeInDown">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold text-primary mb-0">Leave Requests Dashboard</h2>
                        <button id="logoutBtn" class="btn btn-danger">Logout</button>
                    </div>
                    <div class="table-responsive">
                        <table id="hodRequestTable" class="table table-striped align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Student ID</th>
                                    <th>Student Name</th>
                                    <th>Leave Type</th>
                                    <th>Start Date</th>
                                    <th>End Date</th>
                                    <th>Total Days</th>
                                    <th>Reason</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="hodRequestBody">
                                <!-- Requests will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="text-center mt-4 text-muted small">&copy; 2026 Leave Management System</div>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
