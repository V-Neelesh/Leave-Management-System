<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="assets/styles/login.css">
        <script src="login.js" defer></script>
    </head>


    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo" width="36" height="36" style="border-radius:50%">
                </a>
            </div>
        </nav>
        <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
            <div class="row w-100 justify-content-center">
                <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                    <div class="card shadow-lg border-0 rounded-4 p-4 mt-5 animate__animated animate__fadeInDown">
                        <div class="text-center mb-4">
                            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo" width="56" height="56" class="mb-2" style="border-radius:50%">
                            <h2 class="fw-bold text-primary">Leave Management System</h2>
                            <p class="text-muted">Sign in to continue</p>
                        </div>
                        <form id="loginForm" autocomplete="off">
                            <div class="mb-3">
                                <label for="role" class="form-label">Login as</label>
                                <select id="role" name="role" class="form-select" required>
                                    <option value="student">Student</option>
                                    <option value="hod">HOD</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" name="username" class="form-control" required placeholder="Enter your username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                        </form>
                    </div>
                    <div class="text-center mt-4 text-muted small">&copy; 2026 Leave Management System</div>
                </div>
            </div>
        </div>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
